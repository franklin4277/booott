; Copy this file into the VPS deployment directory and replace all credentials.
; Restrict its NTFS permissions because MT5 requires the broker password in clear text.

[Common]
Login=REPLACE_WITH_MT5_ACCOUNT_NUMBER
Password=REPLACE_WITH_MT5_PASSWORD
Server=REPLACE_WITH_BROKER_SERVER:PORT
KeepPrivate=1
NewsEnable=0
CertInstall=0

[Charts]
ProfileLast=Default

[Experts]
Enabled=1
AllowLiveTrading=1
AllowDllImport=0
AllowWebRequest=0

[StartUp]
Symbol=EURUSD
Period=M5
Template=Default.tpl
Expert=IndependentEquityGuard
ExpertParameters=
